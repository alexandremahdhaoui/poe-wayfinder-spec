version: "1"
name: poe-wayfinder-app
language: rust
package: poe_wayfinder_app

binaries:
  # The overlay. Reads the clipboard on a hotkey, prices the item, draws a
  # window over the game.
  - name: poe-wayfinder
    kind: cli
    config:
      # ---------------------------------------------------------------
      # Network. Every key here exists because the reference hardcodes it.
      # ---------------------------------------------------------------
      - name: network_enabled
        type: bool
        env: POE_NETWORK_ENABLED
        flag: network-enabled
        default: "true"
        doc: >-
          Master switch for all outbound traffic. False makes every request
          fail before a socket opens. Use it to run the parser offline.

      - name: block_unlisted_hosts
        type: bool
        env: POE_BLOCK_UNLISTED_HOSTS
        flag: block-unlisted-hosts
        default: "true"
        doc: >-
          Refuse any request whose host is not in allowed_hosts. The reference
          hardcodes an allowlist in main/src/proxy.ts. This makes it config.

      - name: allowed_hosts
        type: string
        env: POE_ALLOWED_HOSTS
        flag: allowed-hosts
        default: "www.pathofexile.com"
        doc: >-
          Comma separated hosts the app may reach. Default is one host. The
          reference also ships regional domains and a private server at
          api.exiledexchange2.dev. We ship neither.

      - name: trade_base_url
        type: string
        env: POE_TRADE_BASE_URL
        flag: trade-base-url
        default: "https://www.pathofexile.com"
        doc: >-
          Base URL for the official trade API. Every trade path is built from
          this. English realm only.

      - name: user_agent
        type: string
        env: POE_USER_AGENT
        flag: user-agent
        doc: >-
          The User-Agent header sent on every request. GGG answers 403 to a
          request that carries none. Their API policy asks for a descriptive
          one with contact details. Empty uses a default naming the tool and
          its version.

      - name: api_latency_seconds
        type: int
        env: POE_API_LATENCY_SECONDS
        flag: api-latency-seconds
        default: "2"
        doc: >-
          Padding added to every rate limit window. GGG bans for violations,
          so the limiter assumes the server clock runs ahead of ours by this
          much. Raise it if you see 429 responses.

      - name: poesessid
        type: string
        env: POE_SESSION_ID
        flag: poesessid
        doc: >-
          The POESESSID cookie. Needed for search and fetch. Never log it and
          never write it to disk in plain text.

      # ---------------------------------------------------------------
      # Game and window
      # ---------------------------------------------------------------
      - name: league
        type: string
        env: POE_LEAGUE
        flag: league
        default: ""
        doc: >-
          Which league to search. The trade site keeps a separate index per
          league, so a wrong one prices an item against a market it is not in.
          Empty means the current league, read from the trade site's own league
          list on startup. Naming one here pins it and stops the detection.

      - name: game
        type: string
        env: POE_GAME
        flag: game
        default: "auto"
        doc: >-
          poe1, poe2, or auto to read it from the open game window. auto keeps
          reading it, so alt tabbing between the two games moves the parser,
          the trade endpoint and the window the overlay attaches to.

      - name: window_title
        type: string
        env: POE_WINDOW_TITLE
        flag: window-title
        default: ""
        doc: >-
          Exact title of the game window the overlay attaches to. Empty derives
          it from the game, which is what auto detection needs. A title given
          here pins the window and stops the overlay following the other game.

      - name: client_log_path
        type: string
        env: POE_CLIENT_LOG_PATH
        flag: client-log-path
        doc: >-
          Path to Client.txt. The app tails it to learn the current league and
          character. Empty disables the watcher.

      # ---------------------------------------------------------------
      # Data and state
      # ---------------------------------------------------------------
      - name: data_dir
        type: string
        env: POE_DATA_DIR
        flag: data-dir
        default: ""
        doc: >-
          Directory holding items.ndjson and stats.ndjson. Empty uses the
          refreshed cache in config_dir, and failing that the copy built into
          this binary. A directory named here always wins, and a bad one is a
          startup failure rather than a silent fallback.

      - name: config_dir
        type: string
        env: POE_CONFIG_DIR
        flag: config-dir
        default: ""
        doc: >-
          Where user settings, the overlay layout and the refreshed data cache
          are stored. Empty picks the per user config directory for the
          platform. A double clicked exe starts in an unpredictable working
          directory, so a relative default would scatter settings files.

      # ---------------------------------------------------------------
      # Behaviour
      # ---------------------------------------------------------------
      - name: price_check_hotkey
        type: string
        env: POE_PRICE_CHECK_HOTKEY
        flag: price-check-hotkey
        default: "Ctrl+D"
        doc: >-
          Key that triggers a price check on the item under the cursor. The
          panel closes again when the pointer moves away.

      - name: price_check_locked_hotkey
        type: string
        env: POE_PRICE_CHECK_LOCKED_HOTKEY
        flag: price-check-locked-hotkey
        default: "Ctrl+Alt+D"
        doc: >-
          Same check, but the panel stays open and takes focus so it can be
          read and adjusted. Only Escape, a click outside or Dismiss closes it.
          This is what Awakened PoE Trade and Exiled Exchange 2 both bind.
          Empty turns it off.

      - name: chat_commands
        env: POE_CHAT_COMMANDS
        type: string
        flag: chat-commands
        default: "F5=/hideout;F9=/exit"
        doc: >-
          Chat lines bound to keys, as key=text separated by semicolons. The
          line is typed and sent. End it with a literal backslash n to type it
          and leave it for you to finish. An entry with no key is ignored, so
          a line can be kept here without a binding.

      - name: item_link_hotkeys
        env: POE_ITEM_LINK_HOTKEYS
        type: string
        flag: item-link-hotkeys
        default: "Alt+W=wiki;Alt+B=poedb;Alt+C=craft of exile"
        doc: >-
          Keys that open the item under the cursor on a reference site, as
          key=site separated by semicolons. The sites are wiki, poedb and
          craft of exile. These open your browser rather than being fetched by
          this app, so the network allowlist does not apply. Empty binds none.

      - name: stash_searches
        env: POE_STASH_SEARCHES
        type: string
        flag: stash-searches
        default: ""
        doc: >-
          Stash search presets bound to keys, as key=text separated by
          semicolons, for example "Ctrl+F1=chaos;Ctrl+F2=exalted". Pressing one
          opens the stash search box and types the text. Empty binds nothing.

      - name: overlay_hotkey
        env: POE_OVERLAY_HOTKEY
        type: string
        flag: overlay-hotkey
        default: "Shift+Space"
        doc: >-
          Grabs the panel that is already on screen so it can be clicked
          without moving the mouse to it, and releases it again. Does nothing
          when no panel is up. Empty turns it off.

      - name: price_check_locked_alt_hotkey
        type: string
        env: POE_PRICE_CHECK_LOCKED_ALT_HOTKEY
        flag: price-check-locked-alt-hotkey
        default: "Ctrl+Shift+D"
        doc: >-
          A second binding for the locked check, easier to reach one handed.
          Empty turns it off.

      - name: restore_clipboard
        type: bool
        env: POE_RESTORE_CLIPBOARD
        flag: restore-clipboard
        default: "true"
        doc: >-
          Put the old clipboard back after reading the item. The app must copy
          to read the item, which destroys whatever the user had.

      - name: log_level
        type: string
        env: POE_LOG_LEVEL
        flag: log-level
        default: "info"
        doc: One of debug, info, warn, error.

  # Headless price check. Same core, no window. Used for tests and scripts.
  - name: poe-wayfinder-cli
    kind: cli
    config:
      - name: network_enabled
        type: bool
        env: POE_NETWORK_ENABLED
        flag: network-enabled
        default: "true"
        doc: Master switch for all outbound traffic.

      - name: block_unlisted_hosts
        type: bool
        env: POE_BLOCK_UNLISTED_HOSTS
        flag: block-unlisted-hosts
        default: "true"
        doc: Refuse any request whose host is not in allowed_hosts.

      - name: allowed_hosts
        type: string
        env: POE_ALLOWED_HOSTS
        flag: allowed-hosts
        default: "www.pathofexile.com"
        doc: Comma separated hosts the app may reach.

      - name: trade_base_url
        type: string
        env: POE_TRADE_BASE_URL
        flag: trade-base-url
        default: "https://www.pathofexile.com"
        doc: Base URL for the official trade API.

      - name: user_agent
        type: string
        env: POE_USER_AGENT
        flag: user-agent
        doc: >-
          The User-Agent header sent on every request. GGG answers 403 to a
          request that carries none. Their API policy asks for a descriptive
          one with contact details. Empty uses a default naming the tool and
          its version.

      - name: api_latency_seconds
        type: int
        env: POE_API_LATENCY_SECONDS
        flag: api-latency-seconds
        default: "2"
        doc: Padding added to every rate limit window.

      - name: poesessid
        type: string
        env: POE_SESSION_ID
        flag: poesessid
        doc: The POESESSID cookie.

      - name: league
        type: string
        env: POE_LEAGUE
        flag: league
        default: ""
        doc: >-
          Which league to search. The trade site keeps a separate index per
          league, so a wrong one prices an item against a market it is not in.
          Empty means the current league, read from the trade site's own league
          list on startup. Naming one here pins it and stops the detection.

      - name: game
        type: string
        env: POE_GAME
        flag: game
        default: "poe2"
        doc: Which game to parse for. Either poe1 or poe2.

      - name: data_dir
        type: string
        env: POE_DATA_DIR
        flag: data-dir
        default: ""
        doc: >-
          Directory holding items.ndjson and stats.ndjson. Empty uses the
          refreshed cache in config_dir, and failing that the copy built into
          this binary. A directory named here always wins, and a bad one is a
          startup failure rather than a silent fallback.

      - name: item_file
        type: string
        env: POE_ITEM_FILE
        flag: item-file
        doc: Read item text from this file instead of the clipboard.

      - name: log_level
        type: string
        env: POE_LOG_LEVEL
        flag: log-level
        default: "info"
        doc: One of debug, info, warn, error.

  # Builds data/*.ndjson. Replaces 7623 lines of Python in the reference.
  - name: poe-wayfinder-datagen
    kind: cli
    config:
      - name: network_enabled
        type: bool
        env: POE_NETWORK_ENABLED
        flag: network-enabled
        default: "true"
        doc: Master switch for all outbound traffic.

      - name: block_unlisted_hosts
        type: bool
        env: POE_BLOCK_UNLISTED_HOSTS
        flag: block-unlisted-hosts
        default: "true"
        doc: Refuse any request whose host is not in allowed_hosts.

      - name: allowed_hosts
        type: string
        env: POE_ALLOWED_HOSTS
        flag: allowed-hosts
        default: "www.pathofexile.com"
        doc: Comma separated hosts the builder may reach.

      - name: trade_base_url
        type: string
        env: POE_TRADE_BASE_URL
        flag: trade-base-url
        default: "https://www.pathofexile.com"
        doc: Base URL used to pull the trade stat and item tables.

      - name: user_agent
        type: string
        env: POE_USER_AGENT
        flag: user-agent
        doc: >-
          The User-Agent header sent on every request. GGG answers 403 to a
          request that carries none. Their API policy asks for a descriptive
          one with contact details. Empty uses a default naming the tool and
          its version.

      - name: api_latency_seconds
        type: int
        env: POE_API_LATENCY_SECONDS
        flag: api-latency-seconds
        default: "2"
        doc: Padding added to every rate limit window.

      - name: tables_dir
        type: string
        env: POE_TABLES_DIR
        flag: tables-dir
        required: true
        doc: Directory holding the extracted game tables.

      - name: out_dir
        type: string
        env: POE_OUT_DIR
        flag: out-dir
        required: true
        doc: Where items.ndjson and stats.ndjson are written.

      - name: game
        type: string
        env: POE_GAME
        flag: game
        default: "poe2"
        doc: Which game to build data for. Either poe1 or poe2.

      - name: log_level
        type: string
        env: POE_LOG_LEVEL
        flag: log-level
        default: "info"
        doc: One of debug, info, warn, error.
